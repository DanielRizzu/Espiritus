<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Marcador de Espíritus</title>

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
  margin:0;
  overflow:hidden;
}

h2{
  margin:6px 0 4px 0;
  font-size:22px;
}

/* ===== PANEL ===== */
#loginBox{
  position:fixed;
  top:10px;
  left:10px;
  background:#1a1a1a;
  padding:10px;
  border:1px solid #333;
  border-radius:8px;
  z-index:9999;
  text-align:left;
  width:220px;
}

select,input,button{
  padding:5px;
  margin:5px 0;
  width:100%;
  box-sizing:border-box;
}

/* BOTÓN BORRAR */
#deleteBtn{
  background:#b30000;
  color:white;
  border:none;
  cursor:pointer;
}

#deleteBtn:hover{
  background:#ff0000;
}

/* ===== MAPA ===== */
#container{
  position:relative;
  display:inline-block;
  margin-top:5px;
}

#img{
  width:900px;
  display:block;
}

/* CHECKBOXES */
.spirit{
  position:absolute;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
  accent-color:lime;
}

/* RESPONSIVE */
@media (max-width: 768px){
  body{ overflow:auto; }

  #loginBox{
    position:relative;
    margin:10px auto;
    width:90%;
  }
}
</style>
</head>

<body>

<h2>Marcador de Espíritus</h2>

<div id="loginBox">
  👤 Usuario:
  <select id="userSelect"></select>

  <input id="newUser" placeholder="nuevo usuario">
  <button onclick="addUser()">Crear</button>

  <button id="deleteBtn" onclick="deleteUser()">Eliminar usuario</button>

  <div id="stats" style="margin-top:10px;">Cargando...</div>
</div>

<div id="container">
  <img id="img" src="pokemones.png">
</div>

<script>

/* ===== CONFIG ===== */

const COLS = 12;
const ROWS = 9;
const TOTAL = COLS * ROWS;

const rowConfig = [
  16, 26.4, 37, 47, 57, 68, 78, 88, 98
];

const colConfig = [
  7, 14, 21.4, 28.5, 35.7, 43, 55, 61.9, 69.3, 76.5, 83.5, 90.5
];

/* ===== ELEMENTOS ===== */

const container = document.getElementById("container");
const userSelect = document.getElementById("userSelect");
const newUser = document.getElementById("newUser");
const stats = document.getElementById("stats");

/* ===== USERS ===== */

let users = JSON.parse(localStorage.getItem("usersList") || "[]");
let currentUser = localStorage.getItem("currentUser") || "guest";

if(!users.includes("guest")){
  users.push("guest");
  localStorage.setItem("usersList", JSON.stringify(users));
}

/* ===== DATA ===== */

let data = [];

/* ===== LOAD USERS ===== */

function loadUsers(){
  userSelect.innerHTML = "";

  users.forEach(u=>{
    const opt = document.createElement("option");
    opt.value = u;
    opt.textContent = u;
    if(u === currentUser) opt.selected = true;
    userSelect.appendChild(opt);
  });
}

userSelect.addEventListener("change",()=>{
  currentUser = userSelect.value;
  localStorage.setItem("currentUser", currentUser);
  loadData();
});

/* ===== ADD USER ===== */

function addUser(){
  const name = newUser.value.trim();
  if(!name) return;

  if(!users.includes(name)){
    users.push(name);
    localStorage.setItem("usersList", JSON.stringify(users));
  }

  currentUser = name;
  localStorage.setItem("currentUser", currentUser);

  loadUsers();
  loadData();
}

/* ===== DELETE USER ===== */

function deleteUser(){

  if(currentUser === "guest"){
    alert("No puedes borrar el usuario guest");
    return;
  }

  if(!confirm(`¿Seguro que quieres borrar a ${currentUser}?`)) return;

  // borrar usuario de lista
  users = users.filter(u => u !== currentUser);
  localStorage.setItem("usersList", JSON.stringify(users));

  // borrar su progreso
  localStorage.removeItem("spirits_" + currentUser);

  // cambiar a guest
  currentUser = "guest";
  localStorage.setItem("currentUser", currentUser);

  loadUsers();
  loadData();
}

/* ===== DATA ===== */

function loadData(){
  const key = "spirits_" + currentUser;
  let saved = JSON.parse(localStorage.getItem(key));

  if(!Array.isArray(saved) || saved.length !== TOTAL){
    saved = Array(TOTAL).fill(false);
  }

  data = saved;
  render();
}

/* ===== RENDER ===== */

function render(){

  container.querySelectorAll(".spirit").forEach(e=>e.remove());

  for(let i=0;i<TOTAL;i++){

    const row = Math.floor(i / COLS);
    const col = i % COLS;

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "spirit";

    cb.style.left = colConfig[col] + "%";
    cb.style.top = rowConfig[row] + "%";

    cb.checked = data[i];

    cb.addEventListener("change",()=>{
      data[i] = cb.checked;
      localStorage.setItem("spirits_" + currentUser, JSON.stringify(data));
      update();
    });

    container.appendChild(cb);
  }

  update();
}

/* ===== STATS ===== */

function update(){
  const done = data.filter(Boolean).length;
  stats.textContent =
    `Usuario: ${currentUser} | Conseguidos: ${done} / ${TOTAL}`;
}

/* ===== INIT ===== */

loadUsers();
loadData();

</script>

</body>
</html>
