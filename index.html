<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Marcador de Espíritus</title>

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
}

#container{
  position:relative;
  display:inline-block;
}

#img{
  width:900px;
  display:block;
}

.spirit{
  position:absolute;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
  accent-color:lime;
}

#loginBox{
  margin:10px;
}

select,input,button{
  padding:5px;
  margin:5px;
}
</style>
</head>

<body>

<h2>Marcador de Espíritus</h2>

<div id="loginBox">
  👤 Usuario:
  <select id="userSelect"></select>
  <input id="newUser" placeholder="nuevo usuario">
  <button onclick="addUser()">Crear</button>
</div>

<div id="stats">Cargando...</div>

<div id="container">
  <img id="img" src="pokemones.png">
</div>

<script>

/* ===================== CONFIG FIJA (NO TOCAR) ===================== */

const COLS = 12;
const ROWS = 9;
const TOTAL = COLS * ROWS;

const rowConfig = [
  16, 26.4, 37, 47, 57, 68, 78, 88, 98
];

const colConfig = [
  7, 14, 21.4, 28.5, 35.7, 43, 55, 61.9, 69.3, 76.5, 83.5, 90.5
];

/* ===================== ELEMENTOS ===================== */

const container = document.getElementById("container");
const userSelect = document.getElementById("userSelect");
const stats = document.getElementById("stats");
const newUser = document.getElementById("newUser");

/* ===================== USUARIOS ===================== */

let users = JSON.parse(localStorage.getItem("usersList") || "[]");
let currentUser = localStorage.getItem("currentUser") || "guest";

if(!users.includes("guest")){
  users.push("guest");
  localStorage.setItem("usersList", JSON.stringify(users));
}

/* ===================== DATA ===================== */

let data = [];

/* ===================== USERS UI ===================== */

function loadUsers(){
  userSelect.innerHTML = "";

  users.forEach(u=>{
    const opt = document.createElement("option");
    opt.value = u;
    opt.textContent = u;
    if(u === currentUser) opt.selected = true;
    userSelect.appendChild(opt);
  });
}

userSelect.addEventListener("change",()=>{
  currentUser = userSelect.value;
  localStorage.setItem("currentUser", currentUser);
  loadData();
});

/* ===================== CREAR USUARIO ===================== */

function addUser(){
  const name = newUser.value.trim();
  if(!name) return;

  if(!users.includes(name)){
    users.push(name);
    localStorage.setItem("usersList", JSON.stringify(users));
  }

  currentUser = name;
  localStorage.setItem("currentUser", currentUser);

  loadUsers();
  loadData();
}

/* ===================== LOAD DATA ===================== */

function loadData(){

  const key = "spirits_" + currentUser;
  let saved = JSON.parse(localStorage.getItem(key));

  if(!Array.isArray(saved) || saved.length !== TOTAL){
    saved = Array(TOTAL).fill(false);
  }

  data = saved;

  render();
}

/* ===================== RENDER ===================== */

function render(){

  container.querySelectorAll(".spirit").forEach(e=>e.remove());

  for(let i=0;i<TOTAL;i++){

    const row = Math.floor(i / COLS);
    const col = i % COLS;

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "spirit";

    /* 🔥 TU SISTEMA ORIGINAL (INTACTO) */
    cb.style.left = colConfig[col] + "%";
    cb.style.top = rowConfig[row] + "%";

    cb.checked = data[i];

    cb.addEventListener("change",()=>{
      data[i] = cb.checked;
      localStorage.setItem("spirits_" + currentUser, JSON.stringify(data));
      update();
    });

    container.appendChild(cb);
  }

  update();
}

/* ===================== STATS ===================== */

function update(){
  const done = data.filter(Boolean).length;
  stats.textContent =
    `Usuario: ${currentUser} | Conseguidos: ${done} / ${TOTAL}`;
}

/* ===================== INIT ===================== */

loadUsers();
loadData();

</script>

</body>
</html>
